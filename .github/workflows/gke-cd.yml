name: Deploy Backend to GKE
run-name: Deploy Backend to GKE - ${{ github.actor }} on ${{ inputs.code_ref }}

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Branch, tag, or commit SHA containing the app code to build and deploy"
        required: true
        default: "main"
        type: string
      tag:
        description: "Docker image tag to build and deploy (e.g. a git sha, defaults to 'latest')"
        required: false
        default: "latest"
      push_latest:
        description: "Whether to also push the 'latest' tag in addition to the specified tag (for tag != 'latest')"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_cache:
        description: "Build Docker image without cache"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write
    
    env:
      PROJECT_ID: project-0c6e9a84-c914-4d2f-ace
      REGION: northamerica-northeast2
      ZONE: northamerica-northeast2-b
      CLUSTER: benzaiten-inference-cluster-b
      REPOSITORY: benzaiten
      IMAGE_NAME: benzaiten-inference
      DEPLOYMENT_NAME: benzaiten-inference-deployment
      CONTAINER_NAME: benzaiten-inference-container
      NAMESPACE: default
      GCP_SERVICE_ACCOUNT: github-actions-sa@project-0c6e9a84-c914-4d2f-ace.iam.gserviceaccount.com
    
    steps:
    - name: Checkout code ref
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.code_ref }}

    - name: Show checked-out code ref
      env:
        CODE_REF: ${{ inputs.code_ref }}
      run: |
        echo "Building and deploying code_ref=${CODE_REF}"
        git rev-parse HEAD

    - name: Authentication to GCP
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
    
    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        version: "latest"
        install_components: "gke-gcloud-auth-plugin"

    - name: Configure Docker auth on gcloud
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Free runner disk space
      run: |
        set -euo pipefail

        echo "Before cleanup:"
        df -h
        docker system df || true

        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/swift

        docker system prune --all --force --volumes || true
        docker builder prune --all --force || true
        docker buildx prune --all --force || true

        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

        echo "After cleanup:"
        df -h
        docker system df || true

        AVAILABLE_KB="$(df --output=avail / | tail -1)"
        MINIMUM_KB="$((20 * 1024 * 1024))"
        if (( AVAILABLE_KB < MINIMUM_KB )); then
          echo "::error::Less than 20 GiB is available for the CUDA image build after cleanup"
          exit 1
        fi

    - name: Build and push image to Artifact Registry
      env:
        BUILDKIT_PROGRESS: plain
        TAG: ${{ inputs.tag }}
        PROJECT_ID: ${{ env.PROJECT_ID }}
        REGION: ${{ env.REGION }}
        REPO: ${{ env.REPOSITORY }}
        IMAGE: ${{ env.IMAGE_NAME }}
        PUSH_LATEST: ${{ inputs.push_latest }}
        NO_CACHE: ${{ inputs.no_cache }}
      run: |
        bash backend/scripts/benzaiten_inference/push-image.sh

    - name: Show runner disk usage after image build
      if: always()
      run: |
        df -h
        docker system df || true
      
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials "${{ env.CLUSTER }}" \
          --zone "${{ env.ZONE }}" \
          --project "${{ env.PROJECT_ID }}"

    - name: Apply K8s manifests
      env:
        K8S_DIR: backend/scripts/benzaiten_inference/k8s
        NAMESPACE: ${{ env.NAMESPACE }}
        BACKEND_GCP_SERVICE_ACCOUNT_EMAIL: ${{ env.GCP_SERVICE_ACCOUNT }}
      run: |
        bash backend/scripts/benzaiten_inference/deploy/deploy-inference-job.sh
      
    - name: Update backend deployment image + inference job image env
      run: |
        IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"

        kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
          ${{ env.CONTAINER_NAME }}="$IMAGE_URI" \
          --namespace "${{ env.NAMESPACE }}"

        kubectl set env deployment/${{ env.DEPLOYMENT_NAME }} \
          IMAGE="$IMAGE_URI" \
          --namespace "${{ env.NAMESPACE }}"
    
    - name: Restart backend deployment
      env:
        DEPLOYMENT: ${{ env.DEPLOYMENT_NAME }}
        NAMESPACE: ${{ env.NAMESPACE }}
      run: |
        bash backend/scripts/benzaiten_inference/deploy/restart_deployment.sh
