name: Deploy Backend to GKE
run-name: Deploy Backend to GKE - ${{ github.actor }} on ${{ inputs.code_ref }}

on:
  workflow_call:
    inputs:
      code_ref:
        description: "Branch, tag, or commit SHA containing the app code to build and deploy"
        required: true
        default: "main"
        type: string
      tag:
        description: "Docker image tag to build and deploy (e.g. a git sha, defaults to 'latest')"
        required: false
        type: string
        default: "latest"
      push_latest:
        description: "Whether to also push the 'latest' tag in addition to the specified tag (for tag != 'latest')"
        required: false
        default: "true"
        type: string
      no_cache:
        description: "Build Docker image without cache"
        required: false
        default: "false"
        type: string

  workflow_dispatch:
    inputs:
      code_ref:
        description: "Branch, tag, or commit SHA containing the app code to build and deploy"
        required: true
        default: "main"
        type: string
      tag:
        description: "Docker image tag to build and deploy (e.g. a git sha, defaults to 'latest')"
        required: false
        default: "latest"
      push_latest:
        description: "Whether to also push the 'latest' tag in addition to the specified tag (for tag != 'latest')"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_cache:
        description: "Build Docker image without cache"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      id-token: write
    
    env:
      PROJECT_ID: project-0c6e9a84-c914-4d2f-ace
      REGION: northamerica-northeast2
      ZONE: northamerica-northeast2-b
      CLUSTER: benzaiten-inference-cluster-b
      REPOSITORY: benzaiten
      IMAGE_NAME: benzaiten-inference
      DEPLOYMENT_NAME: benzaiten-inference-deployment
      CONTAINER_NAME: benzaiten-inference-container
      SERVICE_NAME: benzaiten-inference-service
      NAMESPACE: default
      GCP_SERVICE_ACCOUNT: github-actions-sa@project-0c6e9a84-c914-4d2f-ace.iam.gserviceaccount.com
      CLOUDFLARE_WORKER_URL: https://benzaiten.kaden-seto06.workers.dev
    
    steps:
    - name: Checkout code ref
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.code_ref }}

    - name: Show checked-out code ref
      env:
        CODE_REF: ${{ inputs.code_ref }}
      run: |
        echo "Building and deploying code_ref=${CODE_REF}"
        git rev-parse HEAD

    - name: Authentication to GCP
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
    
    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        version: "latest"
        install_components: "gke-gcloud-auth-plugin"

    - name: Configure GCS browser CORS
      run: bash backend/cors.sh

    - name: Configure Docker auth on gcloud
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Free runner disk space
      run: |
        set -euo pipefail

        echo "Before cleanup:"
        df -h
        docker system df || true

        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/swift

        docker system prune --all --force --volumes || true
        docker builder prune --all --force || true
        docker buildx prune --all --force || true

        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/*

        echo "After cleanup:"
        df -h
        docker system df || true

        AVAILABLE_KB="$(df --output=avail / | tail -1)"
        MINIMUM_KB="$((20 * 1024 * 1024))"
        if (( AVAILABLE_KB < MINIMUM_KB )); then
          echo "::error::Less than 20 GiB is available for the CUDA image build after cleanup"
          exit 1
        fi

    - name: Build and push image to Artifact Registry
      env:
        BUILDKIT_PROGRESS: plain
        TAG: ${{ inputs.tag }}
        PROJECT_ID: ${{ env.PROJECT_ID }}
        REGION: ${{ env.REGION }}
        REPO: ${{ env.REPOSITORY }}
        IMAGE: ${{ env.IMAGE_NAME }}
        PUSH_LATEST: ${{ inputs.push_latest }}
        NO_CACHE: ${{ inputs.no_cache }}
      run: |
        bash backend/scripts/benzaiten_inference/push-image.sh

    - name: Show runner disk usage after image build
      if: always()
      run: |
        df -h
        docker system df || true
      
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials "${{ env.CLUSTER }}" \
          --zone "${{ env.ZONE }}" \
          --project "${{ env.PROJECT_ID }}"

    - name: Apply K8s manifests
      env:
        K8S_DIR: backend/scripts/benzaiten_inference/k8s
        NAMESPACE: ${{ env.NAMESPACE }}
        BACKEND_GCP_SERVICE_ACCOUNT_EMAIL: ${{ env.GCP_SERVICE_ACCOUNT }}
      run: |
        bash backend/scripts/benzaiten_inference/deploy/deploy-inference-job.sh
      
    - name: Update backend deployment image + inference job image env
      run: |
        IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}"

        kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
          ${{ env.CONTAINER_NAME }}="$IMAGE_URI" \
          --namespace "${{ env.NAMESPACE }}"

        kubectl set env deployment/${{ env.DEPLOYMENT_NAME }} \
          IMAGE="$IMAGE_URI" \
          --namespace "${{ env.NAMESPACE }}"
    
    - name: Restart backend deployment
      env:
        DEPLOYMENT: ${{ env.DEPLOYMENT_NAME }}
        NAMESPACE: ${{ env.NAMESPACE }}
      run: |
        bash backend/scripts/benzaiten_inference/deploy/restart_deployment.sh

    - name: Verify Kueue queue configuration
      run: |
        kubectl rollout status deployment/kueue-controller-manager \
          --namespace kueue-system \
          --timeout=180s
        kubectl get clusterqueue benzaiten-cluster-queue
        kubectl get localqueue benzaiten-local-queue \
          --namespace "${{ env.NAMESPACE }}"

    - name: Verify backend service and show external URL
      id: backend_url
      env:
        CONFIGURED_GKE_ORIGIN_URL: ${{ vars.GKE_ORIGIN_URL }}
      run: |
        set -euo pipefail

        kubectl get service "${SERVICE_NAME}" \
          --namespace "${NAMESPACE}" \
          -o wide

        BACKEND_ENDPOINT="$(
          kubectl get endpoints "${SERVICE_NAME}" \
            --namespace "${NAMESPACE}" \
            -o jsonpath='{.subsets[0].addresses[0].ip}' \
            2>/dev/null || true
        )"
        if [[ -z "${BACKEND_ENDPOINT}" ]]; then
          echo "::error::Service ${SERVICE_NAME} has no ready backend endpoints."
          kubectl describe service "${SERVICE_NAME}" --namespace "${NAMESPACE}"
          exit 1
        fi

        EXTERNAL_ADDRESS=""
        for _ in $(seq 1 60); do
          EXTERNAL_ADDRESS="$(
            kubectl get service "${SERVICE_NAME}" \
              --namespace "${NAMESPACE}" \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' \
              2>/dev/null || true
          )"
          if [[ -z "${EXTERNAL_ADDRESS}" ]]; then
            EXTERNAL_ADDRESS="$(
              kubectl get service "${SERVICE_NAME}" \
                --namespace "${NAMESPACE}" \
                -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
                2>/dev/null || true
            )"
          fi
          if [[ -n "${EXTERNAL_ADDRESS}" ]]; then
            break
          fi
          echo "Waiting for LoadBalancer external address..."
          sleep 5
        done

        if [[ -z "${EXTERNAL_ADDRESS}" ]]; then
          echo "::error::Service ${SERVICE_NAME} did not receive an external address within 5 minutes."
          kubectl describe service "${SERVICE_NAME}" --namespace "${NAMESPACE}"
          kubectl get events \
            --namespace "${NAMESPACE}" \
            --sort-by='.lastTimestamp' | tail -30
          exit 1
        fi

        if [[ -n "${CONFIGURED_GKE_ORIGIN_URL}" ]]; then
          BACKEND_URL="${CONFIGURED_GKE_ORIGIN_URL%/}"
        elif [[ "${EXTERNAL_ADDRESS}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          # Cloudflare Workers cannot fetch an IP literal. sslip.io provides a
          # DNS name for the dynamic LoadBalancer IP and keeps this automatic
          # until a first-party GKE_ORIGIN_URL is configured.
          BACKEND_URL="http://${EXTERNAL_ADDRESS}.sslip.io"
          echo "::warning::Using sslip.io for the Worker origin. Configure the GKE_ORIGIN_URL repository variable with a first-party HTTPS origin for production."
        else
          BACKEND_URL="http://${EXTERNAL_ADDRESS}"
        fi
        echo "::notice title=Benzaiten backend URL::${BACKEND_URL}"
        {
          echo "## Benzaiten GKE deployment"
          echo
          echo "Backend URL: ${BACKEND_URL}"
          echo
          echo '```text'
          kubectl get deployment,pods,service \
            --namespace "${NAMESPACE}" \
            -o wide
          echo '```'
        } >> "${GITHUB_STEP_SUMMARY}"

        echo "backend_url=${BACKEND_URL}" >> "${GITHUB_OUTPUT}"
        curl --fail --silent --show-error \
          --retry 12 \
          --retry-delay 5 \
          --retry-all-errors \
          --connect-timeout 5 \
          --max-time 10 \
          "${BACKEND_URL}/"

    - name: Deploy Cloudflare Worker proxy
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_KEY }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        GKE_ORIGIN: ${{ steps.backend_url.outputs.backend_url }}
      working-directory: backend/scripts/service
      run: |
        set -euo pipefail

        if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
          echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing"
          exit 1
        fi

        if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
          echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is missing"
          exit 1
        fi

        if [[ -z "${GKE_ORIGIN}" ]]; then
          echo "::error::The GKE backend URL step did not produce an origin"
          exit 1
        fi

        # The LoadBalancer address is public deployment configuration, so it can
        # be deployed as a Worker variable instead of a secret binding.
        npx --yes wrangler@4 deploy \
          --var "GKE_ORIGIN:${GKE_ORIGIN}"

    - name: Verify Cloudflare Worker proxy
      env:
        WORKER_URL: ${{ env.CLOUDFLARE_WORKER_URL }}
      run: |
        set -euo pipefail

        RESPONSE_HEADERS="$(mktemp)"
        RESPONSE_BODY="$(mktemp)"
        trap 'rm -f "${RESPONSE_HEADERS}" "${RESPONSE_BODY}"' EXIT

        if ! curl --fail --silent --show-error \
          --dump-header "${RESPONSE_HEADERS}" \
          --output "${RESPONSE_BODY}" \
          --retry 12 \
          --retry-delay 5 \
          --connect-timeout 5 \
          --max-time 20 \
          --header "Origin: https://kseto06.github.io" \
          "${WORKER_URL}/health/check_gke_ready"; then
          echo "::error::Cloudflare Worker proxy verification failed"
          cat "${RESPONSE_HEADERS}"
          cat "${RESPONSE_BODY}"
          exit 1
        fi

        if ! grep --ignore-case --quiet \
          '^access-control-allow-origin: https://kseto06.github.io' \
          "${RESPONSE_HEADERS}"; then
          echo "::error::Cloudflare Worker response is missing the expected CORS origin"
          cat "${RESPONSE_HEADERS}"
          exit 1
        fi

        echo "::notice title=Benzaiten production API URL::${WORKER_URL}"
        {
          echo
          echo "Cloudflare Worker API URL: ${WORKER_URL}"
        } >> "${GITHUB_STEP_SUMMARY}"
