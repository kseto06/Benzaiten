name: Docker Build Check CI

on:
    pull_request:
        branches: [ "main", "model-orchestration" ]
        paths:
            - "Dockerfile"
            - ".dockerignore"
            - "backend/**"
            - "requirements.txt"
            - ".github/workflows/docker-build.yml"

jobs:
    docker-build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
            
        - name: Build Docker image
          run: |
            docker buildx build \
                --platform linux/amd64 \
                --f Dockerfile \
                --t benzaiten-inference:test \
                .
        
