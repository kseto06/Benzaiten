name: Docker Build Check CI

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      IMAGE_NAME: benzaiten-inference
      IMAGE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space before Docker build
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          docker system prune --all --force --volumes || true
          docker builder prune --all --force || true

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Show disk usage after cleanup
        run: |
          df -h
          docker system df || true

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Remove CI Docker image and build data
        if: always()
        run: |
          docker image rm --force "${IMAGE_NAME}:${IMAGE_TAG}" 2>/dev/null || true
          docker system prune --all --force --volumes || true
          docker builder prune --all --force || true
