name: Bootstrap GKE Cluster

on:
  workflow_dispatch:
    inputs:
      inference_pool:
        description: "Which node pool should be used as the main inference machine"
        required: true
        default: "cpu-inference-pool"
        type: choice
        options:
          - "cpu-inference-pool"
          - "gpu-pool"
      code_ref:
        description: "Branch, tag, or commit SHA containing the app code to deploy GKE on"
        required: true
        default: "main"
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: project-0c6e9a84-c914-4d2f-ace

    steps:
      - name: Checkout code ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}

      - name: Show checked-out code ref
        env:
          CODE_REF: ${{ inputs.code_ref }}
        run: |
          echo "Bootstrapping GKE from code_ref=${CODE_REF}"
          git rev-parse HEAD

      - name: Authentication to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          version: latest

      - name: Bootstrap GKE
        env:
          INFERENCE_POOL: ${{ inputs.inference_pool }}
        run: |
          bash backend/scripts/benzaiten_inference/bootstrap_gke.sh
