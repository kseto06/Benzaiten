name: Bootstrap GKE Cluster

on: 
  workflow_dispatch:
    inputs:
      enable_gpu:
        description: "Whether to enable GPU support on the cluster (will create a separate GPU node pool if true)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: project-0c6e9a84-c914-4d2f-ace
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authentication to GCP
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    
    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}
        version: 'latest'

    - name: Bootstrap GKE
      env:
        ENABLE_GPU: ${{ inputs.enable_gpu }}
      run: |
        bash backend/scripts/benzaiten_inference/bootstrap_gke.sh