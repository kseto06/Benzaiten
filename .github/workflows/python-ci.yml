name: Python CI Backend Check
run-name: Python CI Backend Check - ${{ github.actor }} on ${{ github.ref_name }}

on:
  workflow_call:

jobs:
    python-ci:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v5

        - name: Set up Python 3.14.3
          uses: actions/setup-python@v5
          with:
            python-version: 3.14.3

        - name: Install dependencies
          run: |
            python -m pip install ruff==0.15.15
        
        - name: Run linter
          run: |
            ruff check backend
