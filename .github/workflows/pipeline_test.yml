# this workflow runs automated tests for the model inference pipeline, verifying outputs at each inference step
name: Inference Pipeline Automated Test Run CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Input branch to run the pipeline test from"
        required: True
        default: ""
      no_cache:
        description: "Build Docker image without cache"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/benzaiten-inference

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Check formatting and lint
        run: |
          ruff check backend
          ruff format --check backend

      - name: Compile backend package
        run: python -m compileall backend

  build-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-compile

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          CACHE_FLAG=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            CACHE_FLAG="--no-cache"
          fi

          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"

          docker buildx build \
            ${CACHE_FLAG} \
            --platform linux/amd64 \
            -f Dockerfile \
            -t "${IMAGE_REF}" \
            --push \
            .

  source-separation-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-docker-image

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Prepare test output directory
        run: |
          rm -rf test_outputs
          mkdir -p test_outputs/source_separation

      - name: Run source separation stage
        run: |
          docker run --rm \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/source_separation_pipeline_test.sh

      - name: Upload source separation outputs
        uses: actions/upload-artifact@v4
        with:
          name: source-separation-outputs
          path: test_outputs/
          retention-days: 1

  decrowd-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: source-separation-pipeline-test

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Download source separation outputs
        uses: actions/download-artifact@v5
        with:
          name: source-separation-outputs
          path: test_outputs

      - name: Run decrowd stage
        run: |
          docker run --rm \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/decrowd_pipeline_test.sh

      - name: Upload decrowd outputs
        uses: actions/upload-artifact@v4
        with:
          name: decrowd-outputs
          path: test_outputs/
          retention-days: 1

  transcription-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: source-separation-pipeline-test

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Download source separation outputs
        uses: actions/download-artifact@v5
        with:
          name: source-separation-outputs
          path: test_outputs

      - name: Run transcription stage
        run: |
          docker run --rm \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/transcription_pipeline_test.sh

      - name: Upload transcription outputs
        uses: actions/upload-artifact@v4
        with:
          name: transcription-outputs
          path: test_outputs/
          retention-days: 1

  build-video-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - decrowd-pipeline-test
      - transcription-pipeline-test

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Download decrowd outputs
        uses: actions/download-artifact@v5
        with:
          name: decrowd-outputs
          path: test_outputs

      - name: Download transcription outputs
        uses: actions/download-artifact@v5
        with:
          name: transcription-outputs
          path: test_outputs

      - name: Run build video stage
        run: |
          docker run --rm \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/build_video_pipeline_test.sh

      - name: Upload final pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-pipeline-test-outputs
          path: test_outputs/
          retention-days: 1