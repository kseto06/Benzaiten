# This workflow runs automated tests for the model inference pipeline, verifying outputs at each inference step
name: Inference Pipeline Automated Test Run CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Input branch to run the pipeline test from"
        required: True
        default: ""
      no_cache:
        description: "Build Docker image without cache"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      - name: Check formatting
        run: |
          ruff check backend
          ruff format --check backend

      - name: Compile backend package
        run: python -m compileall backend

  local-pipeline-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint-and-compile

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build Docker image
        run: |
          CACHE_FLAG=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            CACHE_FLAG="--no-cache"
          fi

          docker buildx build \
            ${CACHE_FLAG} \
            --platform linux/amd64 \
            -f Dockerfile \
            -t benzaiten-inference:test \
            --load \
            .

      - name: Run local pipeline smoke test
        run: |
          mkdir -p test_outputs

          docker run --rm \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/local_pipeline_smoke_test.sh

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-pipeline-smoke-test-outputs
          path: test_outputs/