# This workflow runs automated tests for the model inference pipeline, verifying outputs at each inference step.
name: Inference Pipeline Automated Test Run CI
run-name: Inference Pipeline Automated Test Run CI - ${{ github.actor }} on code ref ${{ inputs.code_ref }} and test ref ${{ inputs.test_ref }}

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Branch, tag, or commit SHA containing the app code to build and test"
        required: true
        default: "model-orchestration"
      test_ref:
        description: "Branch, tag, or commit SHA containing the pipeline test scripts/fixtures"
        required: true
        default: "main"
      run_decrowd:
        description: "Whether to run decrowd inference in the pipeline test"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      run_transcription:
        description: "Whether to run transcription and subtitle generation in the pipeline test"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      run_translation:
        description: "Whether to run translation during the transcription pipeline test"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      no_cache:
        description: "Build Docker image without cache"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      runs-on:
        description: "Which runner to use for the pipeline test"
        required: false
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "self-hosted"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/benzaiten-inference
  BENZAITEN_SMOKE_OUTPUT_DIR: /app/test_outputs/local_pipeline_smoke
  BENZAITEN_SMOKE_INPUT_VIDEO: /app/backend/tests/input_files/i_miss_you_cut_test.mp4

jobs:
  lint-and-compile:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20

    steps:
      - name: Checkout code ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
          path: code

      - name: Show checked-out code ref
        working-directory: code
        run: |
          echo "Testing code_ref=${{ inputs.code_ref }}"
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff==0.15.15

      - name: Check formatting and lint
        working-directory: code
        run: |
          ruff check backend
          ruff format --check backend

      - name: Compile backend package
        working-directory: code
        run: python -m compileall backend

  build-docker-image:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    needs: lint-and-compile

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
          path: code

      - name: Show checked-out code ref
        working-directory: code
        run: |
          echo "Building image from code_ref=${{ inputs.code_ref }}"
          git rev-parse HEAD

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image from code ref
        working-directory: code
        run: |
          CACHE_FLAG=""
          if [ "${{ inputs.no_cache }}" = "true" ]; then
            CACHE_FLAG="--no-cache"
          fi

          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"

          docker buildx build \
            ${CACHE_FLAG} \
            --platform linux/amd64 \
            -f Dockerfile \
            -t "${IMAGE_REF}" \
            --push \
            .

  source-separation-pipeline-test:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    needs: build-docker-image

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
          path: code

      - name: Checkout test harness ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
          path: test_harness

      - name: Show refs
        run: |
          echo "code_ref=${{ inputs.code_ref }}"
          git -C code rev-parse HEAD
          echo "test_ref=${{ inputs.test_ref }}"
          git -C test_harness rev-parse HEAD

      - name: Verify mounted test script is from test harness ref
        run: |
          grep -n "Running bs-roformer source separation" \
            test_harness/backend/scripts/ci/stages/source_separation_pipeline_test.sh || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Prepare test output directory
        run: |
          rm -rf test_outputs
          mkdir -p test_outputs/local_pipeline_smoke

      - name: Run source separation stage
        run: |
          docker run --rm \
            -e BENZAITEN_SMOKE_INPUT_VIDEO="${{ env.BENZAITEN_SMOKE_INPUT_VIDEO }}" \
            -e BENZAITEN_SMOKE_OUTPUT_DIR="${{ env.BENZAITEN_SMOKE_OUTPUT_DIR }}" \
            -v "$PWD/test_harness/backend/tests/input_files:/app/backend/tests/input_files:ro" \
            -v "$PWD/test_harness/backend/scripts/ci/stages:/app/backend/scripts/ci/stages:ro" \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/source_separation_pipeline_test.sh

      - name: Debug source separation outputs
        if: always()
        run: |
          echo "Source separation output tree:"
          find test_outputs -maxdepth 8 -type f -print

      - name: Upload source separation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-separation-outputs
          path: test_outputs/
          retention-days: 1

  decrowd-pipeline-test:
    if: ${{ inputs.run_decrowd == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    needs: [build-docker-image, source-separation-pipeline-test]

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout test harness ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
          path: test_harness

      - name: Show test harness ref
        run: |
          echo "test_ref=${{ inputs.test_ref }}"
          git -C test_harness rev-parse HEAD

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Download source separation outputs
        uses: actions/download-artifact@v5
        with:
          name: source-separation-outputs
          path: test_outputs

      - name: Run decrowd stage
        run: |
          docker run --rm \
            -e BENZAITEN_SMOKE_OUTPUT_DIR="${{ env.BENZAITEN_SMOKE_OUTPUT_DIR }}" \
            -e BENZAITEN_RUN_TRANSLATION="${{ inputs.run_translation }}" \
            -v "$PWD/test_harness/backend/scripts/ci/stages:/app/backend/scripts/ci/stages:ro" \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/decrowd_pipeline_test.sh

      - name: Debug decrowd outputs
        if: always()
        run: |
          echo "Decrowd output tree:"
          find test_outputs -maxdepth 8 -type f -print

      - name: Upload decrowd outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decrowd-outputs
          path: test_outputs/
          retention-days: 1

  transcription-pipeline-test:
    if: ${{ inputs.run_transcription == 'true' }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    needs: source-separation-pipeline-test

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout test harness ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
          path: test_harness

      - name: Show test harness ref
        run: |
          echo "test_ref=${{ inputs.test_ref }}"
          git -C test_harness rev-parse HEAD

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Download source separation outputs
        uses: actions/download-artifact@v5
        with:
          name: source-separation-outputs
          path: test_outputs

      - name: Run transcription stage
        run: |
          docker run --rm \
            -e BENZAITEN_SMOKE_OUTPUT_DIR="${{ env.BENZAITEN_SMOKE_OUTPUT_DIR }}" \
            -v "$PWD/test_harness/backend/scripts/ci/stages:/app/backend/scripts/ci/stages:ro" \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/transcription_pipeline_test.sh

      - name: Debug transcription outputs
        if: always()
        run: |
          echo "Transcription output tree:"
          find test_outputs -maxdepth 8 -type f -print

      - name: Upload transcription outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcription-outputs
          path: test_outputs/
          retention-days: 1

  build-video-pipeline-test:
    if: ${{ always() && (inputs.run_transcription == 'false' || needs.transcription-pipeline-test.result == 'success') && (inputs.run_decrowd == 'false' || needs.decrowd-pipeline-test.result == 'success') }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 45
    needs:
      - decrowd-pipeline-test
      - transcription-pipeline-test

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout test harness ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
          path: test_harness

      - name: Show test harness ref
        run: |
          echo "test_ref=${{ inputs.test_ref }}"
          git -C test_harness rev-parse HEAD

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          IMAGE_REF="$(echo "${REGISTRY}/${IMAGE_NAME}:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" | tr '[:upper:]' '[:lower:]')"
          docker pull "${IMAGE_REF}"
          docker tag "${IMAGE_REF}" benzaiten-inference:test

      - name: Download source separation outputs
        uses: actions/download-artifact@v5
        with:
          name: source-separation-outputs
          path: test_outputs

      - name: Download decrowd outputs
        if: ${{ inputs.run_decrowd == 'true' }}
        uses: actions/download-artifact@v5
        with:
          name: decrowd-outputs
          path: test_outputs

      - name: Download transcription outputs
        if: ${{ inputs.run_transcription == 'true' }}
        uses: actions/download-artifact@v5
        with:
          name: transcription-outputs
          path: test_outputs

      - name: Run build video stage
        run: |
          docker run --rm \
            -e BENZAITEN_SMOKE_OUTPUT_DIR="${{ env.BENZAITEN_SMOKE_OUTPUT_DIR }}" \
            -e BENZAITEN_RUN_DECROWD="${{ inputs.run_decrowd }}" \
            -e BENZAITEN_RUN_TRANSCRIPTION="${{ inputs.run_transcription }}" \
            -v "$PWD/test_harness/backend/scripts/ci/stages:/app/backend/scripts/ci/stages:ro" \
            -v "$PWD/test_outputs:/app/test_outputs" \
            benzaiten-inference:test \
            bash backend/scripts/ci/stages/build_video_pipeline_test.sh

      - name: Debug final outputs
        if: always()
        run: |
          echo "Final output tree:"
          find test_outputs -maxdepth 8 -type f -print

      - name: Upload final pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-pipeline-test-outputs
          path: test_outputs/
          retention-days: 1
