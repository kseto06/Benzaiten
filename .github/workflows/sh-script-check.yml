name: Shell Script Check

on:
    pull_request:
        branches: [ "main", "model-orchestration" ]
        paths:
        - "**/*.sh"
        - ".github/workflows/shellcheck.yml"

jobs:
    shellcheck:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4

        - name: Run ShellCheck
          uses: ludeeus/action-shellcheck@master