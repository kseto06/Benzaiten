name: Kubernetes Manifest Check

on:
    workflow_call:

jobs:
    k8s-check:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4

        - name: Validate Kubernetes manifests client-side
          run: |
            curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
              | tar xz -C /usr/local/bin
            kubeconform -strict -summary \
              backend/scripts/benzaiten_inference/k8s/backend-rbac.yaml \
              backend/scripts/benzaiten_inference/k8s/backend-deployment.yaml \
              backend/scripts/benzaiten_inference/k8s/service.yaml
