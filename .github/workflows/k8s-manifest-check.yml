name: Kubernetes Manifest Check

on:
    workflow_call:

jobs:
    k8s-check:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v4

        - name: Validate Kubernetes manifests client-side
          run: |
            KUBECONFIG=/dev/null kubectl apply --dry-run=client --validate=false \
              -f backend/scripts/benzaiten_inference/k8s/backend-rbac.yaml \
              -f backend/scripts/benzaiten_inference/k8s/backend-deployment.yaml \
              -f backend/scripts/benzaiten_inference/k8s/service.yaml
