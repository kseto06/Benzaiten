<div class="editor-page">
  <header class="editor-header">
    <button class="editor-back" id="backButton" type="button">
      <span>&larr;</span>
      Projects
    </button>
    <label class="editor-project-title">
      <span class="sr-only">Project title</span>
      <input
        id="projectTitleInput"
        value="{{PROJECT_TITLE}}"
        aria-label="Project title"
      />
    </label>
    <div class="editor-actions">
      <span class="editor-save-status" id="editorSaveStatus" aria-live="polite"></span>
      <button class="button" id="saveChangesButton" disabled>Save changes</button>
      <button class="button button-quiet" id="exportVideoButton">Export Video</button>
    </div>
  </header>

  <main class="editor-main">
    <aside class="subtitle-panel" id="subtitlePanel">
      <div class="subtitle-panel-header">
        <h2>Subtitles</h2>
        <p>Edit multiline cues and timing. Changes stay in this browser session.</p>
      </div>
      <div class="subtitle-toolbar">
        <button class="button button-quiet" id="addSubtitleButton">+ Add subtitle</button>
        <label class="font-size-control" for="subtitleFontSizeInput">
          <span>Font</span>
          <input
            id="subtitleFontSizeInput"
            type="number"
            min="12"
            max="72"
            step="1"
            value="{{SUBTITLE_FONT_SIZE}}"
          />
          <span>px</span>
        </label>
      </div>
      <div class="subtitle-list" id="subtitleList">
        <div class="empty-subtitles">Loading subtitle cues from GCS...</div>
      </div>
    </aside>

    <div
      class="panel-resizer"
      id="panelResizer"
      role="separator"
      aria-label="Resize subtitle panel"
      aria-orientation="vertical"
    >
      <button
        class="panel-collapse-button"
        id="panelCollapseButton"
        type="button"
        title="Collapse subtitle panel"
        aria-label="Collapse subtitle panel"
      >
        <span aria-hidden="true">&lsaquo;</span>
      </button>
    </div>

    <section class="editor-workspace">
      <div class="preview-area">
        <div class="preview-stage">
          <video id="editorMedia" crossorigin="anonymous" preload="metadata"></video>
          <div class="audio-preview" id="audioPreview">
            <div class="audio-disc">B</div>
            <strong>{{PROJECT_TITLE}}</strong>
          </div>
          <div
            class="subtitle-transform-box"
            id="subtitleTransformBox"
            tabindex="0"
            aria-label="Subtitle text box"
          >
            <div class="subtitle-overlay" id="subtitleOverlay"></div>
            <span class="subtitle-box-outline" aria-hidden="true"></span>
            <span
              class="subtitle-transform-handle handle-nw"
              data-subtitle-resize="nw"
              aria-hidden="true"
            ></span>
            <span
              class="subtitle-transform-handle handle-n"
              data-subtitle-resize="n"
              aria-hidden="true"
            ></span>
            <span
              class="subtitle-transform-handle handle-ne"
              data-subtitle-resize="ne"
              aria-hidden="true"
            ></span>
            <span
              class="subtitle-transform-handle handle-e"
              data-subtitle-resize="e"
              aria-hidden="true"
            ></span>
            <span
              class="subtitle-transform-handle handle-se"
              data-subtitle-resize="se"
              aria-hidden="true"
            ></span>
            <span
              class="subtitle-transform-handle handle-s"
              data-subtitle-resize="s"
              aria-hidden="true"
            ></span>
            <span
              class="subtitle-transform-handle handle-sw"
              data-subtitle-resize="sw"
              aria-hidden="true"
            ></span>
            <span
              class="subtitle-transform-handle handle-w"
              data-subtitle-resize="w"
              aria-hidden="true"
            ></span>
            <span class="subtitle-rotation-stem" aria-hidden="true"></span>
            <button
              class="subtitle-rotation-handle"
              type="button"
              title="Rotate subtitles"
              aria-label="Rotate subtitles"
              data-subtitle-rotate
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.6 8.2A7.5 7.5 0 1 0 19.5 14h-2.2a5.4 5.4 0 1 1-.5-4.2L14 12h7V5l-2.4 3.2Z"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div
        class="timeline-resizer"
        id="timelineResizer"
        role="separator"
        aria-label="Resize timeline panel"
        aria-orientation="horizontal"
      >
        <button
          class="timeline-collapse-button"
          id="timelineCollapseButton"
          type="button"
          title="Collapse timeline"
          aria-label="Collapse timeline"
        >
          <span aria-hidden="true">&darr;</span>
        </button>
      </div>

      <div class="transport-bar">
        <div class="transport-left">
          <button
            class="transport-button"
            id="skipBackButton"
            title="Back 5 seconds"
            aria-label="Back 5 seconds"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 7 6 12l5 5v-3.5c3.2 0 5.4 1 7 3.5-.4-5-3-7.5-7-7.5V7Z"/>
              <text x="10.5" y="14.3">5</text>
            </svg>
          </button>
          <button
            class="transport-button play"
            id="playButton"
            title="Play"
            aria-label="Play"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="play-icon-path" d="m9 7 8 5-8 5V7Z"/>
            </svg>
          </button>
          <button
            class="transport-button"
            id="skipForwardButton"
            title="Forward 5 seconds"
            aria-label="Forward 5 seconds"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m13 7 5 5-5 5v-3.5c-3.2 0-5.4 1-7 3.5.4-5 3-7.5 7-7.5V7Z"/>
              <text x="7.5" y="14.3">5</text>
            </svg>
          </button>
        </div>
        <div class="transport-center">
          <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
        </div>
        <div class="transport-right">
          <span title="Use the slider, Ctrl/Cmd + mouse wheel, or a touchpad pinch">
            Zoom
          </span>
          <input
            class="zoom-input"
            id="zoomInput"
            type="range"
            min="4"
            max="20"
            value="8"
          />
        </div>
      </div>

      <div class="timeline-shell" id="timelineShell">
        <div class="timeline-scroll" id="timelineScroll">
          <div class="timeline-content" id="timelineContent"></div>
        </div>
        <div class="timeline-drop-hint">
          Drop media here. Pinch or Ctrl/Cmd + wheel to zoom.
        </div>
      </div>
    </section>
  </main>
</div>
