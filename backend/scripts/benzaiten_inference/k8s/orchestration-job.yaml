metadata:
  name: benzaiten-source-separation-job
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: benzaiten-backend-sa

      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-pool

      tolerations:
        - key: "inference"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
        - name: benzaiten-source-separation-container
          image: northamerica-northeast2-docker.pkg.dev/project-0c6e9a84-c914-4d2f-ace/benzaiten/benzaiten-inference:latest
          imagePullPolicy: Always
          command: ["python", "-m", "backend.scripts.orchestration_jobs.run_source_separation_job"]
          env:
            - name: JOB_ID
              value: "job-id-placeholder"
            - name: PIPELINE_STAGE
              value: "source-separation"
            - name: GCS_BUCKET
              value: "benzaiten-outputs"
            - name: INPUT_BLOB_NAME
