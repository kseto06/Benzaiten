apiVersion: batch/v1
kind: Job
metadata:
  name: benzaiten-orchestration-job
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: benzaiten-orchestration-job
        job_id: job-id-placeholder
        stage: orchestrator

    spec:
      restartPolicy: Never
      serviceAccountName: benzaiten-backend-sa

      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool

      tolerations:
        - key: "inference"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
        - name: benzaiten-orchestration-container
          image: northamerica-northeast2-docker.pkg.dev/project-0c6e9a84-c914-4d2f-ace/benzaiten/benzaiten-inference:latest
          imagePullPolicy: Always
          command: ["python", "-m", "backend.scripts.run_orchestration_job"]
          env:
            - name: JOB_ID
              value: "job-id-placeholder"
            - name: GCS_BUCKET
              value: "benzaiten-outputs"
            - name: INPUT_BLOB_NAME
              value: "inputs/job-id-placeholder/placeholder.mp4"
            - name: FILENAME
              value: "placeholder.mp4"
            - name: CONTENT_TYPE
              value: "video/mp4"
            - name: SHOULD_DECROWD
              value: "false"
            - name: SHOULD_TRANSCRIBE
              value: "true"
            - name: LANGUAGE
              value: "mul"
            - name: TARGET_LANGUAGE
              value: "en"
            - name: FAST_DECROWD
              value: "false"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

---
