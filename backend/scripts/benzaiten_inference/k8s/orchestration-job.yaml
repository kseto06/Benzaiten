apiVersion: batch/v1
kind: Job
metadata:
  name: benzaiten-build-video-job
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: benzaiten-backend-sa

      nodeSelector:
        # dedicated CPU pool for video composition and ffmpeg-heavy work
        cloud.google.com/gke-nodepool: video-pool

      tolerations:
        - key: "inference"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
        - name: benzaiten-build-video-container
          image: northamerica-northeast2-docker.pkg.dev/project-0c6e9a84-c914-4d2f-ace/benzaiten/benzaiten-inference:latest
          imagePullPolicy: Always
          command: ["python", "-m", "backend.scripts.orchestration_jobs.run_build_video_job"]
          env:
            - name: JOB_ID
              value: "job-id-placeholder"
            - name: PIPELINE_STAGE
              value: "build-video"
            - name: GCS_BUCKET
              value: "benzaiten-outputs"
            - name: FILENAME
              value: "placeholder.mp4"
            - name: IS_VIDEO
              value: "true"
            - name: SHOULD_TRANSCRIBE
              value: "true"
            - name: INPUT_BLOB_NAME
              value: "inputs/job-id-placeholder/placeholder.mp4"
            - name: VIDEO_BLOB_NAME
              value: "outputs/job-id-placeholder/source_separation/input_video.mp4"
            - name: AUDIO_BLOB_NAME
              value: "outputs/job-id-placeholder/decrowd/instrumental_(decrowd).mp3"
            - name: SRT_BLOB_NAME
              value: "outputs/job-id-placeholder/transcription/vocals.srt"
            - name: VTT_BLOB_NAME
              value: "outputs/job-id-placeholder/transcription/vocals.vtt"
            - name: OUTPUT_VIDEO_BLOB_NAME
              value: "outputs/job-id-placeholder/final_output/placeholder.mp4"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
