apiVersion: v1
kind: ServiceAccount
metadata:
  name: benzaiten-backend-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benzaiten-backend-role
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: benzaiten-backend-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: benzaiten-backend-sa
    namespace: default
roleRef:
  kind: Role
  name: benzaiten-backend-role
  apiGroup: rbac.authorization.k8s.io
